<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мій ДТЕК · інтерактивний прототип</title>
<style>
  :root{font:16px/1.5 system-ui,sans-serif;--primary-color:#1678a0;--primary-text-color:#192d3c;--secondary-text-color:#5f7180;--text-primary-color:#fff;--card-background-color:#fff;--secondary-background-color:#f0f5f8;--divider-color:#d9e3e9;--ha-card-border-radius:18px;color:var(--primary-text-color);background:#edf3f6}
  *{box-sizing:border-box}body{margin:0;padding:24px}body.dark{--primary-color:#63b8dd;--primary-text-color:#ecf1f4;--secondary-text-color:#b4c3cc;--text-primary-color:#12232d;--card-background-color:#202d35;--secondary-background-color:#293a44;--divider-color:#465e6c;background:#142028}
  header{max-width:900px;margin:0 auto 24px}header h1{font-size:1.4em;margin:0 0 6px}header p{color:var(--secondary-text-color);margin:8px 0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  button,input,select{font:inherit;max-width:100%;padding:10px 14px;min-height:44px;border:1px solid var(--divider-color);border-radius:10px;color:inherit;background:var(--card-background-color)}button{cursor:pointer}button.primary{background:var(--primary-color);color:var(--text-primary-color);border-color:transparent;font-weight:600}
  main{max-width:900px;margin:auto}ha-card{box-shadow:0 8px 28px #122c3c0a}#onboarding{max-width:560px;margin:auto;background:var(--card-background-color);padding:28px;border-radius:18px;border:1px solid var(--divider-color)}#onboarding h2{font-size:1.45em;margin:8px 0}#onboarding p{color:var(--secondary-text-color)}#onboarding label{display:block;margin:18px 0}#onboarding input,#onboarding select{display:block;width:100%;margin-top:8px}#onboarding small{color:var(--secondary-text-color)}.choice{display:block;width:100%;text-align:left;margin:12px 0;padding:18px}.choice strong,.choice span{display:block}.choice span{color:var(--secondary-text-color);font-size:.9em;margin-top:4px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.wide{width:100%}[hidden]{display:none!important}a{color:var(--primary-color)}
  @media(max-width:520px){body{padding:12px}header h1{font-size:1.2em}#onboarding{padding:20px}}
</style>
<header>
  <h1>Мій ДТЕК · інтерактивний прототип</h1>
  <p>Вигадані рахунки. Передача показів і SMS імітуються локально — запитів до ДТЕК немає.</p>
  <div class="tools">
    <button id="open-workspace">Робоча картка</button>
    <button id="open-setup">Макет підключення</button>
    <button id="theme">Світла / темна тема</button>
    <button id="language">Українська / English</button>
  </div>
</header>
<main><div id="workspace"></div><section id="onboarding" hidden></section></main>
<script src="../../tests/fixtures/schedule_grid.js"></script>
<script src="../../tests/fixtures/account_workspace.js"></script>
<script type="module">
  import "../../custom_components/dtek_monitor/frontend/account-workspace-card.js";
  import {el} from "../../custom_components/dtek_monitor/frontend/account-ui.js";
  const card=document.createElement("dtek-account-workspace-card");card.setConfig({entity:"sensor.account_1"});card.hass=window.hass;document.querySelector("#workspace").append(card);
  const workspace=document.querySelector("#workspace"), setup=document.querySelector("#onboarding");
  const showWorkspace=()=>{workspace.hidden=false;setup.hidden=true;};
  document.querySelector("#open-workspace").onclick=showWorkspace;
  document.querySelector("#open-setup").onclick=()=>{workspace.hidden=true;setup.hidden=false;screen("region");};
  document.querySelector("#theme").onclick=()=>document.body.classList.toggle("dark");
  document.querySelector("#language").onclick=()=>{window.hass={...hass,language:hass.language==="uk"?"en":"uk"};card.hass=hass;};
  const button=(text,fn,primary=false)=>{const b=el("button",text,primary?"primary":"");b.type="button";b.onclick=fn;return b;};
  const field=(label,value,type="text")=>{const l=el("label",label),i=el("input");i.type=type;i.value=value;i.readOnly=true;l.append(i);setup.append(l);};
  function screen(step){
    setup.replaceChildren(el("small","МАКЕТ ПІДКЛЮЧЕННЯ · ДЕМОНСТРАЦІЯ"));
    if(step==="region"){
      setup.append(el("h2","Де розташований ваш будинок?"),el("p","Оберіть регіон оператора електромереж."));
      const label=el("label","Регіон"),select=el("select");for(const name of ["Одещина","Київ","Київщина","Дніпропетровщина"])select.append(el("option",name));label.append(select);setup.append(label,button("Продовжити",()=>screen(select.selectedIndex===0?"connection":"regional"),true));
    }else if(step==="regional"){
      setup.append(el("h2","Графіки для вашого будинку"),el("p","Для цього регіону доступні графіки за адресою. Особистий кабінет наразі підтримується для Одещини."),button("Обрати інший регіон",()=>screen("region")));
    }else if(step==="connection"){
      setup.append(el("h2","Що хочете підключити?"));
      for(const [title,note,next]of[["Графіки будинку","Адреса та всі групи відключень. Вхід не потрібен.","address"],["Особистий кабінет і покази","Покази, споживання, лічильник і графік своєї квартири.","login"]]){const b=button("",()=>screen(next));b.className="choice";b.append(el("strong",title),el("span",note));setup.append(b);}
    }else if(step==="address"){
      setup.append(el("h2","Адреса будинку"),el("p","Для графіків будинку номер квартири не потрібен."));field("Населений пункт","Одеса");field("Вулиця","Прикладна");field("Будинок","12");setup.append(button("Показати приклад панелі",showWorkspace,true));
    }else if(step==="login"){
      setup.append(el("h2","Увійти в кабінет ДТЕК"),el("p","Після входу оберете потрібні особові рахунки. Покази передаються лише після вашого підтвердження."));field("Телефон","+380 •• ••• •• ••");field("Пароль","demo-only","password");setup.append(button("Увійти · демонстрація",()=>screen("accounts"),true));
      const row=el("div",undefined,"row");row.append(button("Створити кабінет",()=>screen("signup")),button("Забули пароль?",()=>screen("recovery")));setup.append(row);
    }else if(step==="signup"||step==="recovery"){
      setup.append(el("h2",step==="signup"?"Створити кабінет":"Відновити доступ"),el("p","ДТЕК підтверджує номер за допомогою SMS. У цьому макеті код не надсилається."));field("Телефон","+380 •• ••• •• ••");setup.append(button("Отримати код · демонстрація",()=>screen(step==="signup"?"signup-code":"recovery-code"),true),button("До входу",()=>screen("login")));
    }else if(step.endsWith("-code")){
      setup.append(el("h2","Введіть код із SMS"),el("p","Приклад екрана підтвердження телефону. Справжній код не потрібен."));field("Код із SMS","1234");setup.append(button("Підтвердити · демонстрація",()=>screen(step==="signup-code"?"profile":"password"),true));
    }else if(step==="profile"){
      setup.append(el("h2","Як до вас звертатися?"));field("Прізвище","Приклад");field("Ім’я","Олена");field("По батькові · необов’язково","");setup.append(button("Продовжити",()=>screen("password"),true));
    }else if(step==="password"){
      setup.append(el("h2","Новий пароль"));field("Пароль","demo-only","password");field("Повторіть пароль","demo-only","password");setup.append(el("p","У робочому сценарії реєстрації тут також буде явне прийняття умов ДТЕК."),button("Повернутися до входу · демонстрація",()=>screen("login"),true));
    }else if(step==="accounts"){
      setup.append(el("h2","Які рахунки підключити?"),el("p","Кожен рахунок матиме власні покази та налаштування. На панелі можна показувати лише потрібний."));
      for(const a of accounts){const b=button(`${a.address} · ${a.masked}`,()=>screen("ready"));b.className="choice";setup.append(b);}
    }else if(step==="ready"){
      setup.append(el("h2","Ваш кабінет готовий"),el("p","Адресу отримано з кабінету. Графік будинку та домашній датчик енергії можна підключити зараз або пізніше."),button("Відкрити Мій ДТЕК",showWorkspace,true));
    }
  }
</script>
</html>
