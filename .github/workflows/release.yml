---
name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version, assets and changelog
        id: release
        run: python scripts/release.py "$GITHUB_REF_NAME"
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      version: ${{ steps.release.outputs.version }}

  tests:
    needs: verify-version
    uses: ./.github/workflows/tests.yml

  hassfest:
    needs: verify-version
    uses: ./.github/workflows/hassfest.yml

  hacs:
    needs: verify-version
    uses: ./.github/workflows/validate.yml

  github-release:
    needs: [verify-version, tests, hassfest, hacs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Package integration and release notes
        run: >-
          python scripts/release.py "$GITHUB_REF_NAME"
          --notes release-notes.md --archive dtek_monitor.zip
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dtek_monitor.zip
          fail_on_unmatched_files: true
          name: DTEK Monitor ${{ needs.verify-version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.verify-version.outputs.prerelease == 'true' }}
          make_latest: >-
            ${{ needs.verify-version.outputs.prerelease == 'true' && 'false' || 'true' }}
