---
name: HACS Validation

"on":
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          comment: false
          # Custom integration brand assets ship locally since HA 2026.3.
          # The upstream brands repository no longer accepts them.
          ignore: brands

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo \
            --redact --no-banner --log-opts="--all"
